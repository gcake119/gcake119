name: Generate chicken contribution animation

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chicken-snake.yml"
      - "scripts/chickenize-snake.mjs"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4

      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/chicken-contribution-grid.svg?palette=github-light&color_snake=#F2C94C
            dist/chicken-contribution-grid-dark.svg?palette=github-dark&color_snake=#F2C94C

      - name: Turn the snake head into a chick
        run: |
          node scripts/chickenize-snake.mjs \
            dist/chicken-contribution-grid.svg \
            dist/chicken-contribution-grid-dark.svg

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
